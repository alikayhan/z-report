<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z Report</title>
  </head>
  <body>
    <div id="panel">
      <header id="header" data-tauri-drag-region>
        <div class="masthead" data-tauri-drag-region>
          <span class="wordmark" data-tauri-drag-region>Z&thinsp;REPORT</span>
          <span class="header-actions">
            <button id="btn-pin" class="icon-btn" title="Keep window open" aria-label="Keep window open" aria-pressed="false">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5l4 4-1.8.6-2.5 2.5-.3 3.4-2.4-2.4L3 14l-.9-.9 3.4-3.5-2.4-2.4 3.4-.3L9 4.3z"/></svg>
            </button>
            <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.076.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.004.827c-.292.24-.437.613-.43.991a6.932 6.932 0 0 1 0 .255c-.007.378.138.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.297 2.247a1.125 1.125 0 0 1-1.37.491l-1.216-.456c-.356-.133-.751-.072-1.076.124a6.57 6.57 0 0 1-.22.128c-.332.183-.582.495-.644.869l-.214 1.281c-.09.543-.56.94-1.11.94h-2.593c-.55 0-1.02-.397-1.11-.94l-.213-1.281c-.063-.374-.313-.686-.645-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c-.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            </button>
          </span>
        </div>
        <div class="eyebrow" data-tauri-drag-region>
          <span id="status-line">·</span>
          <span id="evaluating" class="evaluating" hidden>reading the tape<span class="dots"><i>.</i><i>.</i><i>.</i></span></span>
        </div>
      </header>

      <nav id="tabs" aria-label="Views">
        <button class="tab active" data-view="review">Review<span id="badge-pending" class="badge" hidden></span></button>
        <button class="tab" data-view="journal">Journal</button>
        <button class="tab" data-view="export">Export</button>
      </nav>

      <main id="content" tabindex="-1"></main>

      <footer id="footer">
        <span class="footer-note">All data stays on this Mac</span>
        <span id="footer-model" class="footer-model"></span>
      </footer>
    </div>
    <div id="merge-bar" hidden>
      <span id="merge-count"></span>
      <button id="btn-merge" class="key key-primary">Merge into one</button>
      <button id="btn-merge-cancel" class="key key-quiet">Cancel</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
