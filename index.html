<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Z Report</title>
  </head>
  <body>
    <div id="app">
      <aside id="side">
        <div class="drag-strip" data-tauri-drag-region></div>
        <div class="brand" data-tauri-drag-region>
          <span class="wordmark" data-tauri-drag-region>Z&thinsp;REPORT</span>
        </div>
        <nav aria-label="Views">
          <button class="nav-item active" data-view="review">Review<span class="badge" id="badge" hidden></span></button>
          <button class="nav-item" data-view="journal">Journal</button>
          <button class="nav-item" data-view="export">Export</button>
        </nav>
        <div class="side-status" id="side-status"></div>
        <div class="side-foot">
          <button class="nav-item" data-view="settings">
            <span class="nav-label">
              <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="5.2"/>
                <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.9 2.9M15.5 15.5l2.9 2.9M18.4 5.6l-2.9 2.9M8.5 15.5l-2.9 2.9"/>
              </svg>Settings
            </span>
          </button>
          <div class="side-version" id="side-version"></div>
        </div>
      </aside>

      <main id="main">
        <section class="view active" id="view-review">
          <div class="pane-list">
            <header class="pane-head" data-tauri-drag-region><span id="queue-count" data-tauri-drag-region></span></header>
            <div class="rows" id="rows"></div>
            <div class="drawer" id="drawer" hidden></div>
            <div id="merge-bar" hidden>
              <span id="merge-count"></span>
              <span class="spacer"></span>
              <button class="key-ink violet" id="btn-merge">Merge into one</button>
              <button class="key-ink" id="btn-merge-cancel">Cancel</button>
            </div>
          </div>
          <div class="pane-detail">
            <header class="pane-head" data-tauri-drag-region>
              <span id="crumb" data-tauri-drag-region></span>
              <span class="head-actions">
                <span class="evaluating" id="evaluating" hidden>reading the tape<i>.</i><i>.</i><i>.</i></span>
                <button class="key-dark" id="btn-xread">Run X-read now</button>
              </span>
            </header>
            <div class="receipt-scroll" id="receipt-scroll"></div>
            <div class="actionbar" id="actionbar"></div>
          </div>
        </section>

        <section class="view" id="view-journal">
          <header class="pane-head" data-tauri-drag-region>
            <input type="search" id="journal-search" placeholder="Search your journal" />
            <span id="journal-count" data-tauri-drag-region></span>
          </header>
          <div class="roll-scroll"><div class="roll" id="roll"></div></div>
        </section>

        <section class="view" id="view-export">
          <header class="pane-head" data-tauri-drag-region>
            <span data-tauri-drag-region>Export</span>
            <span id="export-count" data-tauri-drag-region></span>
          </header>
          <div class="export-scroll">
            <div class="export-grid">
              <div class="export-controls">
                <h3>Range</h3>
                <div class="chip-col" id="chips"></div>
                <div class="range-inputs" id="custom-range" hidden>
                  <input type="date" id="export-from" />
                  <span>to</span>
                  <input type="date" id="export-to" />
                </div>
                <div class="included" id="included"></div>
                <div class="export-actions">
                  <button class="keycap" id="btn-copy">Copy Markdown</button>
                  <button class="keycap paperkey" id="btn-save">Save to file…</button>
                </div>
                <p class="export-hint">Paste into a standup note, a weekly update, or a performance review.</p>
              </div>
              <div class="export-paper">
                <div class="tear top"></div>
                <div class="paper"><pre id="export-preview"></pre></div>
                <div class="tear"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="view" id="view-settings">
          <header class="pane-head" data-tauri-drag-region><span data-tauri-drag-region>Settings</span></header>
          <div class="settings-scroll"><div class="settings-col" id="settings-col"></div></div>
        </section>
      </main>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
