[package]
name = "z-report"
version = "0.3.0"
description = "A local accomplishment journal for Claude Code and Codex work"
edition = "2021"
license = "MIT"
repository = "https://github.com/alikayhan/z-report"

[lib]
name = "z_report_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
z-report-core = { path = "../crates/z-report-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
semver = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
