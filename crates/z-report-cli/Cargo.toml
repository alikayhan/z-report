[package]
name = "z-report-cli"
version = "0.2.2"
edition = "2021"
publish = false

[[bin]]
name = "z-report-engine"
path = "src/main.rs"

[dependencies]
z-report-core = { path = "../z-report-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"
