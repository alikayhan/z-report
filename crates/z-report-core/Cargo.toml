[package]
name = "z-report-core"
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/alikayhan/z-report"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
