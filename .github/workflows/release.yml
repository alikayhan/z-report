name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_REPO: alikayhan/z-report-releases
  BUNDLE_DIR: src-tauri/target/aarch64-apple-darwin/release/bundle

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches project version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG_VERSION Cargo.toml=$CARGO"
          [ "$TAG_VERSION" = "$CARGO" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $CARGO"; exit 1;
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run build
          cargo test --locked --release --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml

      - name: Build, sign, and notarize
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify app signature and staple
        run: |
          set -euo pipefail
          APP="$BUNDLE_DIR/macos/Z Report.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Notarize and staple the DMG
        run: |
          set -euo pipefail
          DMG=$(ls "$BUNDLE_DIR"/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "$BUNDLE_DIR"/dmg/*.dmg "release-assets/Z-Report_${VERSION}_aarch64.dmg"
          cp "$BUNDLE_DIR"/macos/*.app.tar.gz "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz"
          cp "$BUNDLE_DIR"/macos/*.app.tar.gz.sig "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz.sig"

          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Z Report ${VERSION}" > notes.md

          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --rawfile sig "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz.sig" \
            --arg url "https://github.com/${RELEASE_REPO}/releases/download/v${VERSION}/Z-Report_${VERSION}_aarch64.app.tar.gz" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date,
              platforms: {"darwin-aarch64": {signature: ($sig | rtrimstr("\n")), url: $url}}}' \
            > release-assets/latest.json

          (cd release-assets && shasum -a 256 * > checksums.txt)
          echo '## Release assets' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          DMG_SHA=$(shasum -a 256 "release-assets/Z-Report_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          sed -e "s/^  version .*/  version \"${VERSION}\"/" \
              -e "s/^  sha256 .*/  sha256 \"${DMG_SHA}\"/" \
              packaging/homebrew/Casks/z-report.rb > rendered-cask.rb
          echo '## Cask for homebrew-tap (paste into Casks/z-report.rb)' >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          cat rendered-cask.rb >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the release repository
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          gh release create "$TAG" --repo "$RELEASE_REPO" --draft \
            --title "Z Report ${VERSION}" --notes-file notes.md
          gh release upload "$TAG" --repo "$RELEASE_REPO" release-assets/*
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
