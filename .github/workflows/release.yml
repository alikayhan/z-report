name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_REPO: alikayhan/z-report-releases
  BUNDLE_DIR: src-tauri/target/aarch64-apple-darwin/release/bundle

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Verify tag matches project version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG_VERSION Cargo.toml=$CARGO"
          [ "$TAG_VERSION" = "$CARGO" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo.toml version $CARGO"; exit 1;
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm run build
          cargo test --locked --release --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/z-report-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/z-report-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        run: npm run tauri -- build --target aarch64-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify app signature and staple
        run: |
          set -euo pipefail
          APP="$BUNDLE_DIR/macos/Z Report.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Notarize, staple, and verify DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(ls "$BUNDLE_DIR"/dmg/*.dmg)
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"
          codesign --verify --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp "$BUNDLE_DIR"/dmg/*.dmg "release-assets/Z-Report_${VERSION}_aarch64.dmg"
          cp "$BUNDLE_DIR"/macos/*.app.tar.gz "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz"
          cp "$BUNDLE_DIR"/macos/*.app.tar.gz.sig "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz.sig"

          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Z Report ${VERSION}" > notes.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> notes.md

          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_tag "$GITHUB_REF_NAME" \
            --arg target "aarch64-apple-darwin" \
            '{source_commit: $source_commit, source_tag: $source_tag, target: $target}' \
            > release-assets/provenance.json

          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --rawfile sig "release-assets/Z-Report_${VERSION}_aarch64.app.tar.gz.sig" \
            --arg url "https://github.com/${RELEASE_REPO}/releases/download/v${VERSION}/Z-Report_${VERSION}_aarch64.app.tar.gz" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $date,
              platforms: {"darwin-aarch64": {signature: ($sig | rtrimstr("\n")), url: $url}}}' \
            > release-assets/latest.json

          (cd release-assets && shasum -a 256 * > checksums.txt)
          echo '## Release assets' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat release-assets/checksums.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          DMG_SHA=$(shasum -a 256 "release-assets/Z-Report_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          sed -e "s/^  version .*/  version \"${VERSION}\"/" \
              -e "s/^  sha256 .*/  sha256 \"${DMG_SHA}\"/" \
              packaging/homebrew/Casks/z-report.rb > rendered-cask.rb
          echo '## Cask for homebrew-tap (paste into Casks/z-report.rb)' >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          cat rendered-cask.rb >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the release repository
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          gh release create "$TAG" --repo "$RELEASE_REPO" --draft \
            --title "Z Report ${VERSION}" --notes-file notes.md
          gh release upload "$TAG" --repo "$RELEASE_REPO" release-assets/*
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/z-report-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/z-report-certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8
